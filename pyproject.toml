[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luno-myr-paper-research"
version = "0.1.0"
description = "Read-only Luno MYR market research and paper-trading utilities"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2"]

[tool.setuptools]
packages = ["luno_agent"]

[project.scripts]
luno-research = "luno_agent.cli:main"
